#:schema ./vendor/carthage-software/mago/schema.json
version = "1"
php-version = "8.5"

[source]
paths = ["bin", "config", "fixtures", "mate", "migrations", "public", "src", "tests"]
includes = ["vendor"]
# Fichiers générés : les migrations (make:migration, jamais modifiées une fois commitées) et le registre géré par Mate.
excludes = ["config/bundles.php", "config/reference.php", "migrations/", "mate/extensions.php"]

[linter]
integrations = ["symfony", "phpunit"]
minimum-fail-level = "Note"

[linter.rules]
# Mêmes exclusions que l'ancienne complexité cognitive : entités, FormTypes et repositories sont déclaratifs.
cyclomatic-complexity = { exclude = ["src/Entity/", "src/Form/", "src/Repository/"] }
# Les entités portent leur mapping et un constructeur qui pose les invariants : leur taille suit le modèle, pas la logique.
too-many-properties = { exclude = ["src/Entity/"] }
excessive-parameter-list = { exclude = ["src/Entity/"] }
# Convention du projet : assertions PHPUnit appelées en `self::`.
assertion-style = { style = "self_" }
# Les tests utilisent les identifiants des fixtures (`admin@example.com` / `password`).
no-literal-password = { exclude = ["tests/"] }

[analyzer]
minimum-fail-level = "Note"
# Front controller du runtime Symfony (recette) : `$context` n'est pas typé (déjà exclu de l'analyse avant Mago).
excludes = ["public/index.php"]
# Propriétés initialisées par le framework : `setUp()` (PHPUnit), `setUpPlaywright()` (Playwright PHP) et `setContainer()` (AbstractController).
class-initializers = ["setUp", "setUpPlaywright", "setContainer"]
# Faux positif : les sous-classes héritent du `setUp()` d'`E2ETestCase`, que l'analyseur ne suit pas depuis une classe abstraite.
ignore = [{ code = "missing-constructor", in = ["tests/E2E/"] }]
find-unused-definitions = true
find-unused-expressions = true
find-overly-wide-return-types = true
analyze-dead-code = true
strict-list-index-checks = true
strict-array-index-existence = true
no-boolean-literal-comparison = true
check-missing-type-hints = true
check-closure-missing-type-hints = true
check-arrow-function-missing-type-hints = true
check-missing-override = true
find-unused-parameters = true
check-property-initialization = true
check-use-statements = true
check-name-casing = true
