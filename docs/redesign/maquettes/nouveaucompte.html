<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Radar · Nouveau compte (clair)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F8}
a{color:#17181C;text-decoration:none}a:hover{color:#17181C}
.fm-in{animation:fm-in .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes fm-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fm-field{transition:border-color .15s ease,box-shadow .15s ease}
.fm-field:focus{outline:none;border-color:#17181C;box-shadow:0 0 0 4px rgba(23,24,28,.08)}
.nc-team{transition:background .15s ease,border-color .15s ease,transform .12s ease}
.nc-team:hover{border-color:#9AA0AA}
.nc-team:active{transform:scale(.97)}
.fm-btn{transition:transform .15s ease}
.fm-btn:hover{transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.fm-in{animation:none}}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F7F8; color: #17181C; font-family: Inter, ui-sans-serif, system-ui, sans-serif">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 14px clamp(16px, 3vw, 32px); background: #FFFFFF; border-bottom: 1px solid #E3E5E9">
    <a href="Clair-Liens.dc.html" style="display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px">
      <span style="width: 30px; height: 30px; border-radius: 9px; background: #17181C; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 12 18 6"></path><path d="M20 12a8 8 0 1 1-8-8"></path><path d="M16 12a4 4 0 1 1-4-4"></path></svg></span>
      radar
    </a>
    <label for="h-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher</label>
    <input id="h-q" type="search" placeholder="Rechercher un lien…   /" style="flex: 1 1 260px; max-width: 520px; margin: 0 auto; height: 42px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #D5D8DE; background: #F6F7F8; font: inherit; font-size: 15px">
    <a href="Clair-Ajouter.dc.html" style="display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 10px; background: #17181C; color: #FFFFFF; font-size: 15px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Ajouter un lien</a>
    <button type="button" aria-label="Menu du compte" style="width: 42px; height: 42px; border-radius: 50%; border: 1px solid #D5D8DE; background: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer">G</button>
  </header>

  <main class="fm-in" style="max-width: 640px; margin: 0 auto; padding: 32px clamp(16px, 3vw, 32px) 56px; display: flex; flex-direction: column; gap: 22px">
    <a href="Clair-Comptes.dc.html" style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #3B3F47"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>Comptes</a>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Nouveau compte</h1>
      <p style="margin: 0; font-size: 15px; color: #5E636E">La personne se connecte avec son email et le mot de passe provisoire que vous lui transmettez.</p>
    </div>

    <form style="display: flex; flex-direction: column; gap: 20px; padding: 24px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E5E9">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="nc-email" style="font-size: 14px; font-weight: 600">Email</label>
        <input class="fm-field" id="nc-email" type="email" placeholder="prenom@exemple.com" style="height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D5D8DE; background: #FFFFFF; font: inherit; font-size: 15px">
      </div>
      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">Équipe</legend>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(130px, 100%), 1fr)); gap: 8px">
          <label class="nc-team" style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 12px; border: 1.5px solid #17181C; background: #F6F7F8; font-size: 14px; font-weight: 600; cursor: pointer"><input type="radio" name="team" checked="checked" style="accent-color: #17181C"> Développement</label>
          <label class="nc-team" style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #D5D8DE; font-size: 14px; font-weight: 500; cursor: pointer"><input type="radio" name="team" style="accent-color: #17181C"> Produit</label>
          <label class="nc-team" style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #D5D8DE; font-size: 14px; font-weight: 500; cursor: pointer"><input type="radio" name="team" style="accent-color: #17181C"> QA</label>
          <label class="nc-team" style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #D5D8DE; font-size: 14px; font-weight: 500; cursor: pointer"><input type="radio" name="team" style="accent-color: #17181C"> Management</label>
        </div>
      </fieldset>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="nc-pw" style="font-size: 14px; font-weight: 600">Mot de passe provisoire</label>
        <div style="display: flex; gap: 8px">
          <input class="fm-field" id="nc-pw" type="text" style="flex: 1; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D5D8DE; background: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 15px">
          <button type="button" style="height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid #D5D8DE; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Générer</button>
        </div>
        <p style="margin: 0; font-size: 13px; color: #5E636E">Affiché en clair pour que vous puissiez le transmettre : Radar n'envoie aucun email. 8 caractères minimum.</p>
      </div>
      <label style="display: flex; gap: 12px; padding: 14px; border-radius: 12px; background: #F6F7F8; cursor: pointer">
        <input type="checkbox" style="width: 18px; height: 18px; margin: 2px 0 0; accent-color: #17181C">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Admin</span><span style="font-size: 13px; color: #5E636E">Gère les comptes, l'équipe des catégories et les sources suivies.</span></span>
      </label>
      <div style="padding-top: 6px; border-top: 1px solid #EEF0F2">
        <a class="fm-btn" href="Clair-Comptes.dc.html" style="align-self: flex-start; width: fit-content; height: 46px; padding: 0 20px; border-radius: 12px; background: #17181C; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"></path></svg>Créer le compte</a>
      </div>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
