<!doctype html>
<html lang="fr">
<head>

<title>Radar · Comptes (clair)</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F8}
a{color:#17181C;text-decoration:none}a:hover{color:#17181C}
.fm-in{animation:fm-in .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes fm-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.co-row{transition:background .15s ease}
.co-row:hover{background:#FAFAFB}
.co-edit{transition:background .15s ease,color .15s ease}
.co-edit:hover{background:#17181C;color:#FFFFFF}
.co-btn{transition:transform .15s ease}
.co-btn:hover{transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.fm-in{animation:none}}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F7F8; color: #17181C; font-family: Inter, ui-sans-serif, system-ui, sans-serif">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 14px clamp(16px, 3vw, 32px); background: #FFFFFF; border-bottom: 1px solid #E3E5E9">
    <a href="Clair-Liens.dc.html" style="display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px">
      <span style="width: 30px; height: 30px; border-radius: 9px; background: #17181C; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 12 18 6"></path><path d="M20 12a8 8 0 1 1-8-8"></path><path d="M16 12a4 4 0 1 1-4-4"></path></svg></span>
      radar
    </a>
    <label for="h-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher</label>
    <input id="h-q" type="search" placeholder="Rechercher un lien…   /" style="flex: 1 1 260px; max-width: 520px; margin: 0 auto; height: 42px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #D5D8DE; background: #F6F7F8; font: inherit; font-size: 15px">
    <a href="Clair-Ajouter.dc.html" style="display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 10px; background: #17181C; color: #FFFFFF; font-size: 15px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Ajouter un lien</a>
    <button type="button" aria-label="Menu du compte" style="width: 42px; height: 42px; border-radius: 50%; border: 1px solid #D5D8DE; background: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer">G</button>
  </header>

  <main class="fm-in" style="max-width: 880px; margin: 0 auto; padding: 32px clamp(16px, 3vw, 32px) 56px; display: flex; flex-direction: column; gap: 22px">
    <nav aria-label="Administration" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 12px; background: #ECEEF1; align-self: flex-start">
      <a href="Clair-Sources.dc.html" style="height: 36px; padding: 0 14px; border-radius: 9px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #3B3F47">Sources</a>
      <a href="Clair-Comptes.dc.html" aria-current="page" style="height: 36px; padding: 0 14px; border-radius: 9px; background: #FFFFFF; display: flex; align-items: center; font-size: 14px; font-weight: 600; box-shadow: 0 1px 2px rgba(23,24,28,.08)">Comptes</a>
      <a href="Clair-Categories.dc.html" style="height: 36px; padding: 0 14px; border-radius: 9px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #3B3F47">Catégories</a>
    </nav>
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px; max-width: 560px">
        <h1 style="margin: 0; display: flex; align-items: baseline; gap: 12px; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Comptes <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; color: #5E636E">1</span></h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #5E636E">Les personnes qui ont accès à Radar. Un compte désactivé ne peut plus se connecter, mais ses liens restent à son nom.</p>
      </div>
      <a class="co-btn" href="Clair-NouveauCompte.dc.html" style="height: 44px; padding: 0 16px; border-radius: 12px; background: #17181C; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"></path></svg>Nouveau compte</a>
    </div>

    <div style="border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E5E9; overflow: hidden">
      <div class="co-row" style="display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px">
        <span style="width: 44px; height: 44px; border-radius: 50%; background: #17181C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700">G</span>
        <span style="min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">mustiere.gabriel@gmail.com</span>
          <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
            <span style="font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #F1F2F4; color: #3B3F47">Sans équipe</span>
            <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #17181C; color: #FFFFFF"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"></path></svg>admin permanent</span>
            <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #ECFDF5; color: #047857"><span style="width: 6px; height: 6px; border-radius: 50%; background: #059669; display: block"></span>Actif</span>
          </span>
        </span>
        <a class="co-edit" href="Clair-ModifierCompte.dc.html" style="height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid #D5D8DE; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Modifier</a>
      </div>
    </div>
  </main>
</div>
