<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Radar · Reprendre un lien de Chat (clair)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F8}
a{color:#17181C;text-decoration:none}a:hover{color:#17181C}
.fm-in{animation:fm-in .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes fm-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fm-field{transition:border-color .15s ease,box-shadow .15s ease}
.fm-field:focus{outline:none;border-color:#17181C;box-shadow:0 0 0 4px rgba(23,24,28,.08)}
.fm-chip{transition:background .15s ease,border-color .15s ease,transform .12s ease}
.fm-chip:hover{border-color:#9AA0AA}
.fm-chip:active{transform:scale(.96)}
.fm-detect{animation:fm-pop .4s cubic-bezier(.3,1.5,.5,1) both .3s}
@keyframes fm-pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.fm-btn{transition:transform .15s ease}
.fm-btn:hover{transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.fm-in,.fm-detect{animation:none}}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F7F8; color: #17181C; font-family: Inter, ui-sans-serif, system-ui, sans-serif">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 14px clamp(16px, 3vw, 32px); background: #FFFFFF; border-bottom: 1px solid #E3E5E9">
    <a href="Clair-Liens.dc.html" style="display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px">
      <span style="width: 30px; height: 30px; border-radius: 9px; background: #17181C; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 12 18 6"></path><path d="M20 12a8 8 0 1 1-8-8"></path><path d="M16 12a4 4 0 1 1-4-4"></path></svg></span>
      radar
    </a>
    <label for="h-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher</label>
    <input id="h-q" type="search" placeholder="Rechercher un lien…   /" style="flex: 1 1 260px; max-width: 520px; margin: 0 auto; height: 42px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #D5D8DE; background: #F6F7F8; font: inherit; font-size: 15px">
    <a href="Clair-Ajouter.dc.html" style="display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 10px; background: #17181C; color: #FFFFFF; font-size: 15px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Ajouter un lien</a>
    <button type="button" aria-label="Menu du compte" style="width: 42px; height: 42px; border-radius: 50%; border: 1px solid #D5D8DE; background: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer">G</button>
  </header>

  <main class="fm-in" style="max-width: 720px; margin: 0 auto; padding: 32px clamp(16px, 3vw, 32px) 56px; display: flex; flex-direction: column; gap: 22px">
    <a href="Clair-Ajouter.dc.html" style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #3B3F47"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>Ajouter un lien</a>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Reprendre un lien de Chat</h1>
      <p style="margin: 0; font-size: 15px; color: #5E636E">Pour amorcer Radar avec les meilleurs liens déjà postés.</p>
    </div>
    <div style="display: flex; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #EEF2FF; color: #1E2A78">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v5h1"></path></svg>
      <p style="margin: 0; font-size: 14px; line-height: 1.5">Le lien garde sa date et son posteur d'origine, et n'est pas réannoncé dans Google Chat.</p>
    </div>

    <form style="display: flex; flex-direction: column; gap: 22px; padding: 24px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E5E9">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="fm-url" style="font-size: 14px; font-weight: 600">Adresse du lien</label>
        <div style="position: relative">
          <input class="fm-field" id="fm-url" type="url" value="https://github.com/w3c/webauthn" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 170px 0 14px; border-radius: 12px; border: 1px solid #D5D8DE; background: #FFFFFF; font: inherit; font-size: 15px">
          <span class="fm-detect" style="position: absolute; right: 8px; top: 8px; height: 32px; padding: 0 10px; border-radius: 999px; background: #F3EEFF; color: #6D28D9; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 3px; background: #7C3AED; display: block"></span>Dépôt GitHub</span>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="fm-date" style="font-size: 14px; font-weight: 600">Posté dans Chat le</label>
          <input class="fm-field" id="fm-date" type="date" value="2026-10-31" style="height: 46px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #D5D8DE; background: #FFFFFF; font: inherit; font-size: 15px">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="fm-by" style="font-size: 14px; font-weight: 600">Posté par</label>
          <select class="fm-field" id="fm-by" style="height: 46px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #D5D8DE; background: #FFFFFF; font: inherit; font-size: 15px">
            <option>mustiere.gabriel</option>
          </select>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 14px; font-weight: 600">Catégories <span style="font-weight: 500; color: #5E636E">(une à trois)</span></span>
        <div style="display: flex; gap: 8px">
          <label for="fm-cat" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filtrer ou créer une catégorie</label>
          <input class="fm-field" id="fm-cat" type="text" placeholder="Filtrer ou créer une catégorie-besoin, puis Entrée" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D5D8DE; background: #FFFFFF; font: inherit; font-size: 15px">
          <button type="button" aria-label="Créer la catégorie" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #D5D8DE; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17181C" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <button class="fm-chip" type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #17181C; background: #17181C; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Sécurité</button>
          <button class="fm-chip" type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #D5D8DE; background: #FFFFFF; color: #17181C; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Symfony</button>
          <button class="fm-chip" type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #D5D8DE; background: #FFFFFF; color: #17181C; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Conférences</button>
          <button class="fm-chip" type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #D5D8DE; background: #FFFFFF; color: #17181C; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Tests</button>
          <button class="fm-chip" type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #D5D8DE; background: #FFFFFF; color: #17181C; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Veille</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="fm-why" style="font-size: 14px; font-weight: 600">Pourquoi c'est utile <span style="font-weight: 500; color: #5E636E">(facultatif)</span></label>
        <textarea class="fm-field" id="fm-why" rows="3" style="box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid #D5D8DE; background: #FFFFFF; font: inherit; font-size: 15px; line-height: 1.5; resize: vertical">La spécification WebAuthn, pour trancher quand un navigateur se comporte bizarrement.</textarea>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 6px; border-top: 1px solid #EEF0F2">
        <a class="fm-btn" href="Clair-Liens.dc.html" style="height: 46px; padding: 0 20px; border-radius: 12px; background: #17181C; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"></path></svg>Reprendre</a>
        <a href="Clair-Ajouter.dc.html" style="height: 46px; padding: 0 14px; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: #3B3F47">Annuler</a>
      </div>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>

}
</script>
</body>
</html>
