# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Identité de l'extension téléchargée (clé publique, sa clé privée reste hors dépôt) : la changer ferait perdre leur clé aux membres.
    app.extension_public_key: ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Aperçus : les sources sont des URLs saisies par les membres, jamais le réseau interne.
    app.preview_http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['App\HttpClient\PreviewHttpClientFactory', 'create']
        arguments: ['@http_client', '@limiter.preview_host', 'RadarBot/1.0 (+%env(DEFAULT_URI)%)']

# DataFixtures\ n'est autoloadé qu'avec les dépendances de dev (autoload-dev) : absent de l'image de prod.
when@dev:
    services:
        DataFixtures\:
            resource: '../fixtures'
            autowire: true
            autoconfigure: true

when@test:
    services:
        DataFixtures\:
            resource: '../fixtures'
            autowire: true
            autoconfigure: true

        App\Tests\Http\PreviewMockResponseFactory: ~

        # En test, les sources sont simulées : aucun appel réseau, aucune résolution DNS.
        app.preview_http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            arguments: ['@App\Tests\Http\PreviewMockResponseFactory']
