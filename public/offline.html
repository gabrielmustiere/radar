<!DOCTYPE html>
<!-- Servie par le service worker (public/sw.js) : toute modification incrémente sa constante CACHE. -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
    <title>Hors ligne · Radar</title>
    <style>
        :root { color-scheme: light dark; --bg: #fafaf9; --card: #ffffff; --text: #1c1917; --muted: #78716c; --ring: #e7e5e4; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0c0a09; --card: #1c1917; --text: #fafaf9; --muted: #a8a29e; --ring: #292524; }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
            background: var(--bg); color: var(--text);
            font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        }
        main { width: 100%; max-width: 24rem; padding: 2rem; text-align: center; background: var(--card); border-radius: 20px; box-shadow: 0 0 0 1px var(--ring); }
        h1 { margin: 1.25rem 0 0.5rem; font-size: 1.375rem; letter-spacing: -0.01em; }
        p { margin: 0; color: var(--muted); }
        button {
            margin-top: 1.5rem; padding: 0.625rem 1.25rem; border: 0; border-radius: 0.75rem;
            background: var(--text); color: var(--card); font: inherit; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>
<main data-test="offline-page">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="56" height="56" aria-hidden="true"><rect width="128" height="128" rx="28" fill="#1c1917"/><circle cx="64" cy="64" r="34" fill="none" stroke="#ffffff" stroke-width="10"/><circle cx="64" cy="64" r="10" fill="#ffffff"/></svg>
    <h1>Pas de connexion</h1>
    <p>Radar a besoin du réseau pour afficher la veille de l'équipe. Réessaie une fois la connexion revenue.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
